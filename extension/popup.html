<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Chess Bot Hint <span class="version" id="version"></span></h1>
  <p class="subtitle">Настройки движка</p>
  <label class="field"><span>Режим движка</span><select id="mode"></select></label>
  <label class="field"><span>Значение</span><select id="limit"></select></label>
  <label class="field"><span>Сила</span><select id="skill"></select></label>
  <label class="field check"><input type="checkbox" id="safeMode"> <span>Сейфмод: только игры с ботами</span></label>
  <p class="hint">Выключите, чтобы работать на всех страницах chess.com.</p>
  <p class="subtitle">Два независимых режима</p>
  <label class="field check"><input type="checkbox" id="hintEnabled"> <span>Подсказка: стрелка лучшего хода</span></label>
  <label class="field check"><input type="checkbox" id="reviewEnabled"> <span>Разбор: оценки, иконки и полоса перевеса</span></label>
  <p class="hint">Можно включить только подсказку или только разбор. Выключите оба — движок не будет считаться.</p>
  <dl>
    <dt>Страница</dt><dd id="page">…</dd>
    <dt>Мост / движок</dt><dd id="bridge">…</dd>
  </dl>
  <script src="popup.js"></script>
</body>
</html>
